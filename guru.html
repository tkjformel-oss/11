<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guru TKJ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

/* ========== ULTIMATE LOADING SCREEN ========== */
.loading-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #000814 0%, #001d3d 50%, #003566 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  overflow: hidden;
  transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.loading-screen.fade-out {
  opacity: 0;
  transform: scale(1.5);
  filter: blur(20px);
}

/* Matrix Binary Rain */
.matrix-rain {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  opacity: 0.15;
}

.matrix-column {
  position: absolute;
  top: -100%;
  font-family: 'Courier New', monospace;
  font-size: 20px;
  color: #5bb0f6;
  text-shadow: 0 0 8px #5bb0f6;
  animation: matrix-fall linear infinite;
  white-space: nowrap;
}

@keyframes matrix-fall {
  to {
    top: 100%;
  }
}

/* Particles Galaxy */
.loading-particles {
  position: absolute;
  width: 100%;
  height: 100%;
}

.loading-particle {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: particle-float infinite ease-in-out;
  box-shadow: 0 0 10px rgba(91, 176, 246, 0.8);
}

@keyframes particle-float {
  0%, 100% {
    transform: translate(0, 0) scale(1);
    opacity: 0;
  }
  10% { opacity: 1; }
  50% {
    transform: translate(var(--tx), var(--ty)) scale(1.5);
    opacity: 1;
  }
  90% { opacity: 1; }
  100% {
    transform: translate(var(--tx2), var(--ty2)) scale(0.5);
    opacity: 0;
  }
}

/* Scanline Effect */
.scanline {
  position: absolute;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #5bb0f6, transparent);
  box-shadow: 0 0 10px #5bb0f6;
  animation: scan 2s linear infinite;
}

@keyframes scan {
  from { top: 0%; }
  to { top: 100%; }
}

/* Circuit Lines */
.circuit-container {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0.1;
}

.circuit-line {
  position: absolute;
  background: linear-gradient(90deg, transparent, #5bb0f6, transparent);
  animation: circuit-flow 3s ease-in-out infinite;
}

@keyframes circuit-flow {
  0%, 100% { opacity: 0; transform: scale(0); }
  50% { opacity: 1; transform: scale(1); }
}

/* 3D Rotating Cube Logo */
.loading-content {
  position: relative;
  z-index: 10;
  perspective: 1000px;
}

.cube-container {
  width: 150px;
  height: 150px;
  position: relative;
  transform-style: preserve-3d;
  animation: rotate-cube 8s linear infinite;
  margin: 0 auto 40px;
  filter: drop-shadow(0 0 30px rgba(91, 176, 246, 0.8)) 
          drop-shadow(0 0 50px rgba(255, 193, 7, 0.5));
}

@keyframes rotate-cube {
  from {
    transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
  }
  to {
    transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
  }
}

.cube-face {
  position: absolute;
  width: 150px;
  height: 150px;
  background: rgba(255, 255, 255, 0.9);
  border: 3px solid #5bb0f6;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 30px rgba(91, 176, 246, 0.5);
}

.cube-face img {
  width: 80%;
  height: 80%;
  object-fit: contain;
  filter: drop-shadow(0 0 10px rgba(91, 176, 246, 0.5));
}

.cube-face.front  { transform: rotateY(0deg) translateZ(75px); }
.cube-face.back   { transform: rotateY(180deg) translateZ(75px); }
.cube-face.right  { transform: rotateY(90deg) translateZ(75px); }
.cube-face.left   { transform: rotateY(-90deg) translateZ(75px); }
.cube-face.top    { transform: rotateX(90deg) translateZ(75px); }
.cube-face.bottom { transform: rotateX(-90deg) translateZ(75px); }

/* Glitch Text */
.glitch-text {
  font-size: 2em;
  font-weight: 800;
  color: #fff;
  text-align: center;
  margin-bottom: 10px;
  position: relative;
  text-shadow: 
    0 0 10px #5bb0f6,
    0 0 20px #5bb0f6,
    0 0 30px #5bb0f6;
  animation: glitch-effect 3s infinite;
}

@keyframes glitch-effect {
  0%, 100% {
    text-shadow: 
      0 0 10px #5bb0f6,
      0 0 20px #5bb0f6;
  }
  25% {
    text-shadow: 
      -2px 0 #ff0000,
      2px 0 #00ff00,
      0 0 20px #5bb0f6;
  }
  50% {
    text-shadow: 
      2px 0 #ff0000,
      -2px 0 #00ff00,
      0 0 30px #ffc107;
  }
  75% {
    text-shadow: 
      -1px 0 #ff0000,
      1px 0 #00ff00,
      0 0 20px #5bb0f6;
  }
}

/* Typing Text */
.typing-text {
  font-family: 'Courier New', monospace;
  font-size: 1em;
  color: rgba(255, 255, 255, 0.8);
  text-align: center;
  margin-bottom: 30px;
  letter-spacing: 3px;
  min-height: 24px;
}

.typing-cursor {
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* Neon Progress Bar */
.progress-wrapper {
  width: 400px;
  margin: 0 auto 20px;
}

.progress-container {
  width: 100%;
  height: 8px;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 
    inset 0 0 10px rgba(0, 0, 0, 0.5),
    0 0 20px rgba(91, 176, 246, 0.3);
  position: relative;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, 
    #5bb0f6 0%, 
    #ffc107 50%, 
    #5bb0f6 100%);
  background-size: 200% 100%;
  border-radius: 10px;
  box-shadow: 
    0 0 20px #5bb0f6,
    0 0 40px #5bb0f6,
    0 0 60px rgba(255, 193, 7, 0.5);
  animation: 
    progress-fill 2.5s ease-out forwards,
    gradient-flow 2s linear infinite;
  position: relative;
}

.progress-bar::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 20px;
  height: 100%;
  background: white;
  filter: blur(10px);
  animation: spark 0.5s ease-in-out infinite;
}

@keyframes progress-fill {
  from { width: 0%; }
  to { width: 100%; }
}

@keyframes gradient-flow {
  to { background-position: 200% 0; }
}

@keyframes spark {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* Percentage */
.percentage {
  text-align: center;
  font-size: 1.2em;
  font-weight: 700;
  color: #fff;
  margin-bottom: 20px;
  text-shadow: 0 0 10px #5bb0f6;
}

/* Circuit Status Dots */
.status-dots {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}

.status-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  border: 2px solid rgba(91, 176, 246, 0.3);
  transition: all 0.3s;
}

.status-dot.active {
  background: #5bb0f6;
  border-color: #5bb0f6;
  box-shadow: 
    0 0 10px #5bb0f6,
    0 0 20px #5bb0f6;
  animation: pulse-dot 0.5s ease-in-out;
}

@keyframes pulse-dot {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.5); }
}

/* Explosion Effect */
.explosion {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.explosion-particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #5bb0f6;
  border-radius: 50%;
  animation: explode 0.8s ease-out forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--ex), var(--ey));
    opacity: 0;
  }
}

/* Responsive */
@media (max-width: 768px) {
  .cube-container {
    width: 120px;
    height: 120px;
  }
  
  .cube-face {
    width: 120px;
    height: 120px;
  }
  
  .cube-face.front, .cube-face.back, 
  .cube-face.right, .cube-face.left,
  .cube-face.top, .cube-face.bottom {
    transform-origin: center;
  }
  
  .cube-face.front  { transform: rotateY(0deg) translateZ(60px); }
  .cube-face.back   { transform: rotateY(180deg) translateZ(60px); }
  .cube-face.right  { transform: rotateY(90deg) translateZ(60px); }
  .cube-face.left   { transform: rotateY(-90deg) translateZ(60px); }
  .cube-face.top    { transform: rotateX(90deg) translateZ(60px); }
  .cube-face.bottom { transform: rotateX(-90deg) translateZ(60px); }
  
  .glitch-text {
    font-size: 1.5em;
  }
  
  .progress-wrapper {
    width: 300px;
  }
  
  .matrix-column {
    font-size: 16px;
  }
}

@media (max-width: 480px) {
  .cube-container {
    width: 100px;
    height: 100px;
  }
  
  .cube-face {
    width: 100px;
    height: 100px;
  }
  
  .cube-face.front  { transform: rotateY(0deg) translateZ(50px); }
  .cube-face.back   { transform: rotateY(180deg) translateZ(50px); }
  .cube-face.right  { transform: rotateY(90deg) translateZ(50px); }
  .cube-face.left   { transform: rotateY(-90deg) translateZ(50px); }
  .cube-face.top    { transform: rotateX(90deg) translateZ(50px); }
  .cube-face.bottom { transform: rotateX(-90deg) translateZ(50px); }
  
  .glitch-text {
    font-size: 1.2em;
  }
  
  .progress-wrapper {
    width: 250px;
  }
  
  .typing-text {
    font-size: 0.85em;
  }
}

/* ========== MAIN WEBSITE STYLES ========== */
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #5bb0f6 0%, #ffffff 100%);
  color: #001f4d;
  position: relative;
  overflow-x: hidden;
  padding-top: 100px;
  padding-bottom: 50px;
}

.particles {
  position: fixed;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 0;
  top: 0;
  left: 0;
}

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  animation: float-particle 15s infinite;
}

@keyframes float-particle {
  0%, 100% {
    transform: translateY(0) translateX(0);
    opacity: 0;
  }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% {
    transform: translateY(-100vh) translateX(100px);
    opacity: 0;
  }
}

.tkj-decor {
  position: fixed;
  opacity: 0.15;
  animation: float 10s infinite ease-in-out alternate;
  z-index: 0;
  filter: drop-shadow(0 0 10px rgba(91, 176, 246, 0.3));
}

@keyframes float {
  0%, 100% { 
    transform: translateY(0) rotate(0deg); 
  }
  50% { 
    transform: translateY(-30px) rotate(10deg); 
  }
}

.router { top: 10%; left: 10%; width: 70px; animation-delay: 0s; }
.cpu { top: 60%; left: 80%; width: 70px; animation-delay: 2s; }
.chip { top: 30%; left: 75%; width: 60px; animation-delay: 4s; }
.gear { top: 75%; left: 15%; width: 80px; animation-delay: 1s; }
.lan { top: 45%; left: 5%; width: 60px; animation-delay: 3s; }

.navbar {
  width: 100%;
  background: rgba(255, 255, 255, 0.25);
  border-bottom: 2px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(20px);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 40px;
  box-shadow: 0 4px 20px rgba(91, 176, 246, 0.1);
}

.logo-container {
  display: flex;
  align-items: center;
  gap: 15px;
}

.navbar .logo {
  width: 65px;
  height: 65px;
  border: 3px solid #fff;
  border-radius: 50%;
  background: white;
  object-fit: cover;
  box-shadow: 0 5px 20px rgba(91, 176, 246, 0.3);
  transition: transform 0.3s;
}

.navbar .logo:hover {
  transform: scale(1.1) rotate(5deg);
}

.navbar .menu {
  display: flex;
  gap: 10px;
}

.navbar .menu a {
  text-decoration: none;
  color: #001f4d;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: 25px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.navbar .menu a:before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 193, 7, 0.3), transparent);
  transition: left 0.5s;
}

.navbar .menu a:hover:before {
  left: 100%;
}

.navbar .menu a:hover {
  background: #ffc107;
  color: #001f4d;
  transform: translateY(-3px);
  box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
}

.navbar .menu a:active {
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(255, 193, 7, 0.3);
}

.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 5px;
}

.hamburger div {
  width: 28px;
  height: 3px;
  background: #001f4d;
  border-radius: 3px;
  transition: all 0.3s;
}

.hamburger:hover div {
  background: #ffc107;
}

.section {
  max-width: 1100px;
  margin: 30px auto;
  background: rgba(255, 255, 255, 0.35);
  border: 3px solid rgba(255, 255, 255, 0.5);
  border-radius: 30px;
  padding: 50px 60px;
  backdrop-filter: blur(20px);
  box-shadow: 0 15px 50px rgba(0, 31, 77, 0.1);
  position: relative;
  z-index: 2;
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.section h2 {
  margin-bottom: 50px;
  color: #001f4d;
  text-align: center;
  font-size: 2.5em;
  font-weight: 800;
  text-shadow: 0 3px 10px rgba(91, 176, 246, 0.2);
  background: linear-gradient(135deg, #001f4d 0%, #5bb0f6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.guru-row {
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  gap: 30px;
  flex-wrap: wrap;
}

.guru-card {
  flex: 1;
  min-width: 250px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  border: 3px solid rgba(255, 255, 255, 0.6);
  border-radius: 25px;
  padding: 35px 25px;
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(91, 176, 246, 0.15);
  transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.guru-card:before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent, rgba(91, 176, 246, 0.1), transparent);
  transform: rotate(45deg);
  transition: all 0.6s;
}

.guru-card:hover:before {
  left: 100%;
  top: 100%;
}

.guru-card:hover {
  transform: translateY(-15px) scale(1.05);
  box-shadow: 0 20px 50px rgba(91, 176, 246, 0.3);
  border-color: #ffc107;
  background: rgba(255, 255, 255, 0.7);
}

.guru-card:active {
  transform: translateY(-10px) scale(1.02);
}

.img-container {
  position: relative;
  margin-bottom: 20px;
}

.img-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 130px;
  height: 130px;
  border: 2px dashed rgba(91, 176, 246, 0.3);
  border-radius: 50%;
  animation: rotate 20s linear infinite;
}

@keyframes rotate {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

.guru-card img {
  width: 110px;
  height: 110px;
  border: 4px solid #ffffff;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 8px 25px rgba(91, 176, 246, 0.3);
  transition: all 0.4s;
  position: relative;
  z-index: 1;
}

.guru-card:hover img {
  transform: scale(1.15);
  box-shadow: 0 12px 35px rgba(255, 193, 7, 0.4);
  border-color: #ffc107;
}

.guru-card .name {
  font-weight: 700;
  color: #001f4d;
  font-size: 1.15em;
  line-height: 1.6;
  position: relative;
  z-index: 1;
  margin-bottom: 8px;
}

.guru-card .role {
  font-weight: 600;
  color: #5bb0f6;
  font-size: 0.95em;
  position: relative;
  z-index: 1;
}

.modal {
  display: none;
  position: fixed;
  z-index: 2000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background: rgba(0, 31, 77, 0.85);
  backdrop-filter: blur(10px);
}

.modal.show {
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s;
}

.modal-content {
  position: relative;
  background: linear-gradient(135deg, 
    rgba(255, 254, 250, 0.98) 0%, 
    rgba(255, 250, 235, 0.96) 100%);
  margin: 20px;
  padding: 0;
  border-radius: 30px;
  width: 90%;
  max-width: 400px;
  box-shadow: 
    0 30px 80px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(255, 255, 255, 0.8) inset,
    0 0 80px rgba(255, 200, 100, 0.2);
  overflow: hidden;
  animation: modalSlide 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes modalSlide {
  from {
    opacity: 0;
    transform: scale(0.7) translateY(50px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.modal-header {
  background: linear-gradient(135deg, #f4bd76 0%, #f0a952 100%);
  padding: 25px 20px 55px;
  position: relative;
  overflow: hidden;
}

.modal-header::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 150px;
  height: 150px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  animation: pulse 4s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.3; }
  50% { transform: scale(1.2); opacity: 0.5; }
}

.close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.25);
  border: 2px solid rgba(255, 255, 255, 0.6);
  border-radius: 50%;
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  z-index: 10;
  backdrop-filter: blur(10px);
}

.close:hover {
  background: #fff;
  border-color: #fff;
  transform: rotate(180deg) scale(1.1);
  color: #f0a952;
}

.modal-img-container {
  position: relative;
  z-index: 2;
  margin-top: -45px;
  display: flex;
  justify-content: center;
}

.modal-img-wrapper {
  position: relative;
  width: 110px;
  height: 110px;
}

.modal-img-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 130px;
  height: 130px;
  border: 2px solid rgba(240, 169, 82, 0.4);
  border-radius: 50%;
  animation: rotate 20s linear infinite;
}

.modal-img-ring::before {
  content: '';
  position: absolute;
  top: -4px;
  left: 50%;
  width: 8px;
  height: 8px;
  background: #f4bd76;
  border-radius: 50%;
  box-shadow: 0 0 12px #f4bd76;
}

.modal-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 4px solid #fff;
  box-shadow: 
    0 10px 35px rgba(240, 169, 82, 0.3),
    0 0 0 2px rgba(240, 169, 82, 0.25);
  display: block;
  object-fit: cover;
  position: relative;
  z-index: 1;
  animation: floatModal 3s ease-in-out infinite;
}

@keyframes floatModal {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.modal-body {
  padding: 18px 22px 28px;
}

.modal-content h3 {
  text-align: center;
  color: #5a3e00;
  font-size: 1.4em;
  margin-bottom: 6px;
  font-weight: 800;
}

.role-modal {
  text-align: center;
  color: #d68910;

  bottom: -7px;

.info-icon {

<script>
// ========== ULTIMATE LOADING SCREEN SCRIPT ==========

window.addEventListener('load', function() {
  const loadingScreen = document.getElementById('loadingScreen');
  const percentage = document.getElementById('percentage');
  const typingText = document.getElementById('typingText');
  const statusDots = document.querySelectorAll('.status-dot');
  const explosion = document.getElementById('explosion');
  
  const messages = [
    'INITIALIZING SYSTEM...',
    'LOADING CORE FILES...',
    'CONNECTING DATABASE...',
    'LOADING ASSETS...',
    'OPTIMIZING...',
    'READY TO LAUNCH!'
  ];
  
  let progress = 0;
  let messageIndex = 0;
  let charIndex = 0;
  let currentMessage = '';
  
  // Typing effect
  function typeMessage() {
    if (messageIndex < messages.length) {
      if (charIndex < messages[messageIndex].length) {
        currentMessage += messages[messageIndex][charIndex];
        typingText.innerHTML = currentMessage + '<span class="typing-cursor">_</span>';
        charIndex++;
        setTimeout(typeMessage, 50);
      } else {
        setTimeout(() => {
          currentMessage = '';
          charIndex = 0;
          messageIndex++;
          typeMessage();
        }, 400);
      }
    }
  }
  
  typeMessage();
  
  // Progress animation
  const progressInterval = setInterval(() => {
    if (progress < 100) {
      progress += 1.5;
      percentage.textContent = Math.floor(progress) + '%';
      
      // Activate status dots
      const dotIndex = Math.floor((progress / 100) * statusDots.length);
      if (dotIndex < statusDots.length) {
        statusDots[dotIndex].classList.add('active');
      }
    } else {
      clearInterval(progressInterval);
      
      // Create explosion effect
      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'explosion-particle';
        const angle = (Math.PI * 2 * i) / 30;
        const velocity = 100 + Math.random() * 100;
        particle.style.setProperty('--ex', Math.cos(angle) * velocity + 'px');
        particle.style.setProperty('--ey', Math.sin(angle) * velocity + 'px');
        explosion.appendChild(particle);
      }
      
      setTimeout(() => {
        loadingScreen.classList.add('fade-out');
        setTimeout(() => {
          loadingScreen.style.display = 'none';
        }, 800);
      }, 300);
    }
  }, 25);
});

// Matrix Rain Effect
const matrixRain = document.getElementById('matrixRain');
const matrixChars = '01';
for (let i = 0; i < 30; i++) {
  const column = document.createElement('div');
  column.className = 'matrix-column';
  column.style.left = Math.random() * 100 + '%';
  column.style.animationDuration = (Math.random() * 3 + 2) + 's';
  column.style.animationDelay = Math.random() * 2 + 's';
  
  let text = '';
  for (let j = 0; j < 20; j++) {
    text += matrixChars[Math.floor(Math.random() * matrixChars.length)] + '<br>';
  }
  column.innerHTML = text;
  matrixRain.appendChild(column);
}

// Loading Particles
const loadingParticles = document.getElementById('loadingParticles');
for (let i = 0; i < 50; i++) {
  const particle = document.createElement('div');
  particle.className = 'loading-particle';
  particle.style.width = particle.style.height = (Math.random() * 3 + 2) + 'px';
  particle.style.left = Math.random() * 100 + '%';
  particle.style.top = Math.random() * 100 + '%';
  particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
  particle.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
  particle.style.setProperty('--tx2', (Math.random() - 0.5) * 400 + 'px');
  particle.style.setProperty('--ty2', (Math.random() - 0.5) * 400 + 'px');
  particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
  particle.style.animationDelay = Math.random() * 2 + 's';
  loadingParticles.appendChild(particle);
}

function showBiodata(guruId) {
  const data = biodataGuru[guruId];
  const modal = document.getElementById('biodataModal');
  
  document.getElementById('modalImg').src = data.img;
  document.getElementById('modalName').textContent = data.nama;
  document.getElementById('modalRole').textContent = data.jabatan;
  
  const biodataList = document.getElementById('biodataList');
  biodataList.innerHTML = `

      <div class="info-icon">🆔</div>

    <div class="info-item">

  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const modal = document.getElementById('biodataModal');
  modal.classList.remove('show');
  document.body.style.overflow = 'auto';
}

window.onclick = function(event) {
  const modal = document.getElementById('biodataModal');
  if (event.target == modal) {
    closeModal();
  }
}

const particlesContainer = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
